version: "3.9"

services:
  bot:
    build: .
    container_name: nexus-rag-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - faiss_data:/app/data
      - ./logs:/app/logs
      - ./knowledge_base:/app/knowledge_base
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  faiss_data:
